# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - appforseii-losbalicki

on:
  push:
    branches:
      - 'LuisCebrian-ContinuousDelivery' # Set a branch name to trigger deployment
  pull_request:
    branches:
      - 'development'
    # paths:
    #   - 'src/AppForSEII.API/**'
    types: # triggers the workflow when a PR is closed.
      - closed

  workflow_dispatch:

env:
  API: ./src/AppForSEII.API/AppForSEII.API.csproj

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read # This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore ${{ env.API }}

      - name: Build with dotnet
        run: dotnet build ${{ env.API }} --configuration Release --no-restore

      - name: dotnet publish
        run: dotnet publish ${{ env.API }} -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    # Condición Diapositiva 22: asegura que solo despliega si la PR fue aceptada (merged)
    # También permitimos workflow_dispatch por si quieres forzarlo a mano desde GitHub
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'

    runs-on: windows-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      # - name: Login to Azure
      #   uses: azure/login@v2
      #   with:
      #     client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2DA643E78A354C5FB3575A193CBBBA73 }}
      #     tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D8F6986D1F044B68A40DAEB4EB315034 }}
      #     subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D3C3A1B085F543FCA5229DB248840556 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'appforseii-losbalicki'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_LUISCEBRIAN }}
          package: .